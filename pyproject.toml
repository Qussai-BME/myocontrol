[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myocontrol"
version = "0.5.0"
description = "Production-Ready EMG AI Platform — feature extraction, classification, edge deployment, and SHAP transparency"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Qussai Adlbi", email = "qussai.adlbi@au.edu.sy"},
]
keywords = ["emg", "semg", "gesture-recognition", "myoelectric-control", "onnx", "shap"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "pandas>=1.3",
    "scikit-learn>=1.0",
    "xgboost>=1.6",
    "shap>=0.41",
    "numba>=0.57",
    "matplotlib>=3.5",
    "reportlab>=4.0",
    "pypdf>=4.0",
    "psutil>=5.8",
]

[project.optional-dependencies]
ui = ["streamlit>=1.20", "plotly>=5.0"]
api = ["fastapi>=0.85", "uvicorn>=0.18", "python-multipart>=0.0.5", "pydantic>=1.10"]
onnx = ["onnx>=1.14", "onnxruntime>=1.16", "skl2onnx>=1.16", "onnxmltools>=1.11"]
torch = ["torch>=2.0"]
all = ["myocontrol[ui,api,onnx,torch]"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
